baseURL = 'https://carlosmichaeljimenez.github.io/'
defaultContentLanguage = 'en'
theme = 'PaperMod'

# Enable raw HTML rendering for custom divs (language bars, shortcuts)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  disableThemeToggle = true
  defaultTheme = "light"

  [params.label]
    text = "Home"

[languages]
  [languages.en]
    label = "English"
    languagelabel = "En"
    weight = 1
    title = "Carlos Michael Jimenez-Muñoz"
    
    [languages.en.params.profileMode]
      enabled = true
      title = "Carlos Michael Jimenez-Muñoz"
      subtitle = "PhD candidate in Quantum Chemistry at TU Darmstadt"
      imageUrl = "photo.jpeg"
      imageWidth = 300
      imageHeight = 300
      buttons = [
        { name = "Bio", url = "/bio/" }, 
        { name = "Research & Publications", url = "/publications/" },
        { name = "Career & Credentials", url = "/awards/" },
        { name = "Talks & Presentations", url = "/talks/" },
        { name = "Teaching & Mentorship", url = "/teaching/" },
        { name = "CV", url = "/cv.pdf" }
      ]

