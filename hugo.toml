baseURL = 'https://carlosmichaeljimenez.github.io/'
defaultContentLanguage = 'en'
theme = 'PaperMod'

# Enable raw HTML rendering for custom divs (language bars, shortcuts)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[imaging]
  resampleFilter = "Lanczos"
  quality = 95
  
[params]
  disableThemeToggle = true
  defaultTheme = "light"

  [params.label]
    text = "Home"

[languages]
  [languages.en]
    label = "English"
    languagelabel = "En"
    weight = 1
    title = "Carlos Michael Jimenez-Muñoz"
    
    [languages.en.params.profileMode]
      enabled = true
      title = "Carlos Michael Jimenez-Muñoz"
      subtitle = "PhD candidate in Quantum Chemistry at TU Darmstadt"
      imageUrl = "photo.jpeg"
      buttons = [
        { name = "Bio", url = "/bio/" }, 
        { name = "Research & Career", url = "/career/" },
        { name = "Teaching Portfolio", url = "/teaching/" },
        { name = "CV", url = "/cv.pdf" }
      ]

  [languages.es]
    label = "Español"
    languagelabel = "Es"
    weight = 2
    title = "Carlos Michael Jimenez-Muñoz"
    
    [languages.es.params.profileMode]
      enabled = true
      title = "Carlos Michael Jimenez-Muñoz"
      subtitle = "Candidato Doctoral en Química Cuántica en TU Darmstadt"
      imageUrl = "photo.jpeg"
      buttons = [
        { name = "Bio", url = "/es/bio/" }, 
        { name = "Investigación y Trayectoria", url = "/es/career/" },
        { name = "Portafolio Docente", url = "/teaching/" },
        { name = "CV", url = "/cv.pdf" }
      ]

  [languages.de]
    label = "Deutsch"
    languagelabel = "De"
    weight = 3
    title = "Carlos Michael Jimenez-Muñoz"
    
    [languages.de.params.profileMode]
      enabled = true
      title = "Carlos Michael Jimenez-Muñoz"
      subtitle = "Doktorand in Quantenchemie an der TU Darmstadt"
      imageUrl = "photo.jpeg"
      buttons = [
        { name = "Über mich", url = "/de/bio/" },
        { name = "Forschung & Werdegang", url = "/de/career/" },
        { name = "Lehrportfolio", url = "/teaching/" },
        { name = "CV", url = "/cv.pdf" }
      ]

