<footer class="footer">
    {{- if not site.Params.disableFooter }}
        <span>&copy; {{ now.Year }} <a href="{{ "" | relURL }}">{{ site.Title }}</a></span>
        
        <div style="margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.8rem; opacity: 0.8;">
            <span>Visits:</span>
            <img src="https://hits.seeyouatwell.com/count/embed.svg?url=https%3A%2F%2Fcarlosmichaeljimenez.github.io&icon=user&icon_color=%23FFFFFF&title=none&edge_flat=false&background_color=%23123524&count_color=%23FFFFFF" alt="Visitor Count" style="vertical-align: middle; height: 18px; border-radius: 3px;" />
        </div>
    {{- end }}
</footer>
<noscript>
    <style>
        .top-link { display: none !important; }
    </style>
</noscript>
